name: Android CI

# Runs the unit tests and builds the debug APK on every push and pull request
# to main, so the app is verified on a clean machine and not just on mine.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle dependencies and wrapper to speed up later runs
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # local.properties is gitignored, so recreate it for the build.
      # Add GEMINI_API_KEY under Settings > Secrets and variables > Actions.
      - name: Create local.properties
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > local.properties

      # Only needed if app/google-services.json is NOT committed.
      # Add the file's full contents as the GOOGLE_SERVICES_JSON secret.
      - name: Restore google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing. Commit it or add the GOOGLE_SERVICES_JSON secret."
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EduConnect-debug-apk
          path: app/build/outputs/apk/debug/*.apk
